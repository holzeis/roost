# Generates the iOS app icon set from assets/icon/icon_full.png (the
# 1024x1024 rendering of assets/logo/roost-logo.svg, full bleed, no alpha —
# iOS applies its own corner mask). Run after changing the logo:
#   dart run flutter_launcher_icons
#
# Android's icon isn't generated: its adaptive icon is vector drawables
# drawn from the same SVG (res/drawable/ic_launcher_background.xml, the
# gradient; ic_launcher_foreground.xml, the bubble, also used as the
# monochrome layer for themed icons), plus legacy mipmap PNGs for
# pre-Android 8 — update those by hand with the logo.
flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon/icon_full.png"
  remove_alpha_ios: true
