services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roost-dev-password}
      POSTGRES_DB: roost
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage — was MinIO until its free/self-hosted
  # image distribution was discontinued entirely (Docker Hub pulls killed
  # 2026-09-11, then the quay.io mirror locked down too on 2026-09-24, and
  # the only image left, quay.io/minio/aistor/minio, needs a paid Docker ELS
  # entitlement since upstream MinIO itself is now archived/unmaintained).
  # SeaweedFS's S3 gateway is the drop-in replacement: internal/storage
  # talks to it through the same generic minio-go S3 client unchanged (only
  # the endpoint/credentials differ) — see architecture-overview.md.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    # "server" runs master+volume+filer+the S3 gateway (-s3) in one
    # process, the right shape for a single-node homelab deployment rather
    # than SeaweedFS's own multi-node topology. -s3.port matches the app's
    # own S3_ENDPOINT default below (SeaweedFS's own default is 8333;
    # keeping that here rather than picking a different port for no reason).
    #
    # -master.volumeSizeLimitMB=100, not SeaweedFS's own default (1000):
    # confirmed empirically that even trivial usage (a handful of tiny test
    # objects) eagerly pre-allocates over a dozen volume files at the
    # configured size regardless of how little data is actually stored —
    # 14 volumes at the 1000MB default is ~14GB reserved from nothing, which
    # is what actually exhausted a 58GB dev VM disk during this migration's
    # own testing. 100MB keeps that upfront cost around 1.4GB; SeaweedFS
    # transparently allocates more volumes as these fill, so this doesn't
    # cap total storage, only how much is reserved per volume at a time.
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=100
    environment:
      # SeaweedFS's S3 gateway falls back to these standard AWS env vars
      # for its one admin identity when no -s3.config file is given — the
      # same S3_ACCESS_KEY/S3_SECRET_KEY chat-server itself uses below, so
      # there's exactly one credential pair to keep in sync, not two.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-roost}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-roost-dev-password}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # The master's own status endpoint, not the S3 port directly — an
      # unauthenticated request to the S3 API correctly 403s (wget's
      # --spider treats any non-2xx/3xx as failure), which isn't what
      # "is this service up" needs here.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret-devsecret-devsecret}"
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50100:50000-50100/udp"

  chat-server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: "postgres://roost:${POSTGRES_PASSWORD:-roost-dev-password}@postgres:5432/roost?sslmode=disable"
      S3_ENDPOINT: "seaweedfs:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-roost}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-roost-dev-password}"
      S3_BUCKET: "roost-media"
      S3_USE_SSL: "false"
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-devsecret-devsecret-devsecret}"
      # FR5.1 push (see server/internal/push) — unlike LiveKit above, there's
      # no safe dev fallback value for these, so they're left unset unless
      # your own .env sets them; unset means the server falls back to
      # push.NoopSender and local dev works the same as always, just without
      # a real call-wake push actually going out.
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_PRIVATE_KEY: "${APNS_PRIVATE_KEY:-}"
      # "true" for TestFlight/App Store builds (production APNs tokens);
      # leave unset for Xcode/`flutter run` builds (sandbox tokens).
      APNS_PRODUCTION: "${APNS_PRODUCTION:-}"
      FCM_SERVICE_ACCOUNT_JSON: "${FCM_SERVICE_ACCOUNT_JSON:-}"
      # FR3.7 ended-share map snapshot (see server/internal/staticmap) —
      # same no-safe-dev-fallback reasoning as the push vars above; unset
      # means ended shares just don't get a snapshot.
      GOOGLE_MAPS_STATIC_API_KEY: "${GOOGLE_MAPS_STATIC_API_KEY:-}"
      # Local dev only: bypasses real Tailscale identity resolution with a
      # fixed fake identity, since there's no tailnet to join from a laptop
      # docker-compose stack. Never set this in production. See
      # server/internal/auth/dev_resolver.go.
      ENABLE_DEV_AUTH: "true"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  seaweedfs-data:
