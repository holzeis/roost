# The chat server joins the tailnet itself via tsnet (see the architecture
# overview's "Chat server joins the tailnet itself" decision), so it needs no
# Tailscale-operator Service exposure — only a reusable auth key and a small
# persistent volume so its tailnet node identity survives pod restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-server
  namespace: roost
  labels:
    app: chat-server
spec:
  replicas: 1 # the WebSocket hub (server/internal/ws) is in-memory and per-pod; keep this at 1 until that's addressed
  selector:
    matchLabels:
      app: chat-server
  template:
    metadata:
      labels:
        app: chat-server
    spec:
      containers:
        - name: chat-server
          image: ghcr.io/REPLACE_ME/roost-chat-server:latest # set by CI on release; see .github/workflows/ci.yml
          env:
            - name: TSNET_HOSTNAME
              value: "roost-chat"
            - name: TSNET_STATE_DIR
              value: "/var/lib/tsnet"
            - name: TSNET_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: chat-server-tailscale
                  key: authkey
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chat-server-db
                  key: url
            - name: S3_ENDPOINT
              value: "minio.roost.svc.cluster.local:9000"
            - name: S3_BUCKET
              value: "roost-media"
            - name: S3_USE_SSL
              value: "false"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: chat-server-minio
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: chat-server-minio
                  key: secret-key
            - name: LIVEKIT_URL
              value: "ws://livekit.roost.svc.cluster.local:7880"
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chat-server-livekit
                  key: api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-server-livekit
                  key: api-secret
          volumeMounts:
            - name: tsnet-state
              mountPath: /var/lib/tsnet
          readinessProbe:
            # This checks only that the process is up, not that it has an
            # active tailnet session — the real API is only reachable inside
            # the tailnet (see cmd/server's probeServer doc comment).
            httpGet:
              path: /healthz
              port: 9000
              host: 127.0.0.1
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9000
              host: 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tsnet-state
          persistentVolumeClaim:
            claimName: chat-server-tsnet-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chat-server-tsnet-state
  namespace: roost
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
