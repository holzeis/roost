# The chat server joins the tailnet itself via tsnet (see the architecture
# overview's "Chat server joins the tailnet itself" decision), so it needs no
# Tailscale-operator Service exposure — only a reusable auth key and a small
# persistent volume so its tailnet node identity survives pod restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-server
  namespace: roost
  labels:
    app: chat-server
spec:
  replicas: 1 # the WebSocket hub (server/internal/ws) is in-memory and per-pod; keep this at 1 until that's addressed
  strategy:
    type: Recreate # avoids two pods briefly fighting over the same ReadWriteOnce tsnet-state PVC during a rollout
  selector:
    matchLabels:
      app: chat-server
  template:
    metadata:
      labels:
        app: chat-server
    spec:
      automountServiceAccountToken: false # this pod never talks to the k8s API
      enableServiceLinks: false # avoid Kubernetes' auto-injected <SVC>_PORT-style env vars; everything here uses explicit DNS names instead
      securityContext:
        runAsNonRoot: true
        # 65532 is distroless's baked-in "nonroot" uid/gid (see the
        # server/Dockerfile's `FROM gcr.io/distroless/static-debian12:nonroot`
        # and `USER nonroot:nonroot`) — set explicitly here too so it's
        # enforced by the cluster, not just left as an image default.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chat-server
          image: ghcr.io/holzeis/roost-chat-server:latest # set by CI on release; see .github/workflows/ci.yml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Safe here specifically: this is a static Go binary (no shell,
            # no package manager, nothing to install at runtime) that only
            # writes to /var/lib/tsnet, which is its own PVC mount and stays
            # writable regardless of this setting. tsnet also runs its
            # network stack in userspace (no TUN device), so it needs no
            # elevated capabilities either.
            readOnlyRootFilesystem: true
          env:
            - name: TSNET_HOSTNAME
              value: "roost-chat"
            - name: TSNET_STATE_DIR
              value: "/var/lib/tsnet"
            - name: TSNET_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: chat-server-tailscale
                  key: authkey
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chat-server-db
                  key: url
            - name: S3_ENDPOINT
              value: "minio.roost.svc.cluster.local:9000"
            - name: S3_BUCKET
              value: "roost-media"
            - name: S3_USE_SSL
              value: "false"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: chat-server-minio
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: chat-server-minio
                  key: secret-key
            - name: LIVEKIT_URL
              value: "ws://livekit.roost.svc.cluster.local:7880"
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chat-server-livekit
                  key: api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-server-livekit
                  key: api-secret
          volumeMounts:
            - name: tsnet-state
              mountPath: /var/lib/tsnet
          readinessProbe:
            # This checks only that the process is up, not that it has an
            # active tailnet session — the real API is only reachable inside
            # the tailnet (see cmd/server's probeServer doc comment). No
            # explicit host here — the kubelet's probe runs from the node's
            # own network namespace and connects to the pod's real IP by
            # default; an explicit "127.0.0.1" would instead target the
            # *node's* own loopback (a different, real bug this used to
            # have, since probeServer itself binds all interfaces, not just
            # loopback, precisely so this default reaches it).
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tsnet-state
          persistentVolumeClaim:
            claimName: chat-server-tsnet-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chat-server-tsnet-state
  namespace: roost
spec:
  storageClassName: longhorn # so this volume can follow the pod across the cluster's nodes; see k8s/README.md
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
