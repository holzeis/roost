# LiveKit, as its own tailnet node.
#
# Originally this was exposed via the Tailscale operator's LoadBalancer-class
# Service, which works fine for TCP signaling but breaks WebRTC media: an SFU
# has to advertise ICE candidates clients can actually route to, and LiveKit
# (sitting behind the proxy, seeing only its pod IP) advertised 10.42.x.x —
# unreachable from a phone on the tailnet. Calls connected and then timed out
# with "Timed Out waiting for PeerConnection to connect".
#
# The fix mirrors what chat-server already does: be a tailnet node rather than
# sit behind a proxy. chat-server embeds tsnet in-process; LiveKit can't, so a
# Tailscale sidecar shares this pod's network namespace instead. The pod gets
# a real 100.x.y.z address, LiveKit advertises it via rtc.node_ip, and media
# flows client->pod directly over WireGuard with full UDP and nothing in the
# path. See docs/architecture-overview.md's call-flow section.
#
# Consequently there is no Service here at all — same as chat-server. Nothing
# in-cluster talks to LiveKit (chat-server only mints JWTs locally, it never
# opens a connection), and clients reach it at roost-livekit.<tailnet>.ts.net
# via the sidecar's TS_HOSTNAME.
#
# Secrets, created out-of-band:
#   livekit-config    (key: config.yaml) - full LiveKit config, incl. keys + rtc.node_ip
#   livekit-tailscale (key: authkey)     - a reusable Tailscale auth key
# See k8s/README.md for the exact commands and the two-phase node_ip step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: roost
  labels:
    app: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate # only one pod may hold the tailnet identity / its state PVC at a time
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      automountServiceAccountToken: false # neither container talks to the k8s API
      enableServiceLinks: false # Kubernetes' auto-injected LIVEKIT_PORT=tcp://... collides with livekit-server's own --port flag
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livekit
          image: livekit/livekit-server:latest # matches docker-compose.yml
          securityContext:
            runAsNonRoot: true
            # Generic non-root uid, not verified against this image's own
            # internals — it has no volumes and only needs to read env vars
            # and bind non-privileged ports, so any uid should work. If it
            # fails to start with a permissions error, check what uid the
            # image expects.
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: LIVEKIT_CONFIG
              valueFrom:
                secretKeyRef:
                  name: livekit-config
                  key: config.yaml
          # Informational only (container ports don't gate connectivity) —
          # the real media ports are whatever rtc.port_range_* in the config
          # says, reached over the tailnet interface the sidecar provides.
          ports:
            - name: signaling
              containerPort: 7880
            - name: rtc-tcp
              containerPort: 7881
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
        - name: tailscale
          image: tailscale/tailscale:stable
          securityContext:
            # Kernel-mode networking needs NET_ADMIN to bring up the tailnet
            # interface. This is the one elevated privilege in the whole
            # deployment, and the reason the namespace carries no Pod
            # Security Standards label — both `restricted` and `baseline`
            # forbid adding NET_ADMIN (see k8s/namespace.yaml). Userspace
            # mode would avoid the capability but forwards inbound UDP
            # poorly, which is precisely what the media path needs.
            # Everything else here stays non-root with all caps dropped.
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: TS_HOSTNAME
              value: "roost-livekit" # the MagicDNS name clients connect to
            - name: TS_STATE_DIR
              value: "/var/lib/tailscale"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: livekit-tailscale
                  key: authkey
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: livekit-tailscale-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: livekit-tailscale-state
  namespace: roost
spec:
  # Persisting tailscaled's state keeps the node identity — and therefore
  # the 100.x.y.z address that rtc.node_ip is pinned to — stable across
  # restarts. Without this, every restart would register a new node and the
  # configured node_ip would go stale.
  storageClassName: longhorn
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
