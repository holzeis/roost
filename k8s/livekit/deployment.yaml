# LiveKit, as its own tailnet node.
#
# Originally this was exposed via the Tailscale operator's LoadBalancer-class
# Service, which works fine for TCP signaling but breaks WebRTC media: an SFU
# has to advertise ICE candidates clients can actually route to, and LiveKit
# (sitting behind the proxy, seeing only its pod IP) advertised 10.42.x.x —
# unreachable from a phone on the tailnet. Calls connected and then timed out
# with "Timed Out waiting for PeerConnection to connect".
#
# The fix mirrors what chat-server already does: be a tailnet node rather than
# sit behind a proxy. chat-server embeds tsnet in-process; LiveKit can't, so a
# Tailscale sidecar shares this pod's network namespace instead. The pod gets
# a real 100.x.y.z address, LiveKit advertises it via rtc.node_ip, and media
# flows client->pod directly over WireGuard with full UDP and nothing in the
# path. See docs/architecture-overview.md's call-flow section.
#
# Consequently there is no Service here at all — same as chat-server. Nothing
# in-cluster talks to LiveKit (chat-server only mints JWTs locally, it never
# opens a connection), and clients reach it at roost-livekit.<tailnet>.ts.net
# via the sidecar's TS_HOSTNAME.
#
# Credentials come from the single `roost-secrets` Secret shared by every
# service here (keys: tailscale-authkey, livekit-api-key, livekit-api-secret,
# livekit-node-ip). See k8s/README.md for creating it and for the two-phase
# node_ip step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: roost
  labels:
    app: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate # only one pod may hold the tailnet identity / its state PVC at a time
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      automountServiceAccountToken: false # neither container talks to the k8s API
      enableServiceLinks: false # Kubernetes' auto-injected LIVEKIT_PORT=tcp://... collides with livekit-server's own --port flag
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livekit
          image: livekit/livekit-server:latest # matches docker-compose.yml
          securityContext:
            runAsNonRoot: true
            # Generic non-root uid, not verified against this image's own
            # internals — it has no volumes and only needs to read env vars
            # and bind non-privileged ports, so any uid should work. If it
            # fails to start with a permissions error, check what uid the
            # image expects.
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # Only the key/secret pair is sensitive, so only it comes from
            # the Secret — the rest of LiveKit's config is plain deployment
            # config and lives here in the open, where it's reviewable and
            # editable without touching secrets. Kubernetes expands $(VAR)
            # against env vars defined EARLIER in this list, so order
            # matters: both of these must precede LIVEKIT_CONFIG.
            - name: LK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: roost-secrets
                  key: livekit-api-key
            - name: LK_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: roost-secrets
                  key: livekit-api-secret
            # node_ip is the tailnet address the sidecar registers, and it's
            # what LiveKit advertises as its ICE candidate — see the
            # two-phase setup in k8s/README.md. Not secret, but deployment-
            # specific, so it's kept in the same Secret as everything else
            # you have to fill in per-cluster rather than hardcoded here.
            - name: LK_NODE_IP
              valueFrom:
                secretKeyRef:
                  name: roost-secrets
                  key: livekit-node-ip
            - name: LIVEKIT_CONFIG
              value: |
                keys:
                  $(LK_API_KEY): $(LK_API_SECRET)
                rtc:
                  tcp_port: 7881
                  port_range_start: 50000
                  port_range_end: 50019
                  use_external_ip: false
                  node_ip: $(LK_NODE_IP)
          # Informational only (container ports don't gate connectivity) —
          # the real media ports are whatever rtc.port_range_* in the config
          # says, reached over the tailnet interface the sidecar provides.
          ports:
            - name: signaling
              containerPort: 7880
            - name: rtc-tcp
              containerPort: 7881
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
        - name: tailscale
          image: tailscale/tailscale:stable
          securityContext:
            # Kernel-mode networking needs NET_ADMIN to bring up the tailnet
            # interface. This is the one elevated privilege in the whole
            # deployment, and the reason the namespace carries no Pod
            # Security Standards label — both `restricted` and `baseline`
            # forbid adding NET_ADMIN (see k8s/namespace.yaml). Userspace
            # mode would avoid the capability but forwards inbound UDP
            # poorly, which is precisely what the media path needs.
            # Everything else here stays non-root with all caps dropped.
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: TS_HOSTNAME
              value: "roost-livekit" # the MagicDNS name clients connect to
            - name: TS_STATE_DIR
              value: "/var/lib/tailscale"
            # The tailscale image defaults to storing its state in a
            # Kubernetes Secret whenever it detects it's running in-cluster
            # (which it does from KUBERNETES_SERVICE_HOST, injected by
            # kubelet regardless of enableServiceLinks). That needs a
            # service account token, which automountServiceAccountToken:
            # false above removes — so it fails at boot with "error
            # initializing kube client ... serviceaccount/namespace: no such
            # file or directory". Empty disables that path entirely, leaving
            # TS_STATE_DIR above as the sole state store, which is what we
            # want: the PVC is what keeps the node identity (and its
            # advertised node_ip) stable across restarts.
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_USERSPACE
              value: "false"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: roost-secrets
                  key: tailscale-authkey
          volumeMounts:
            - name: tailscale-state
              mountPath: /var/lib/tailscale
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: tailscale-state
          persistentVolumeClaim:
            claimName: livekit-tailscale-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: livekit-tailscale-state
  namespace: roost
spec:
  # Persisting tailscaled's state keeps the node identity — and therefore
  # the 100.x.y.z address that rtc.node_ip is pinned to — stable across
  # restarts. Without this, every restart would register a new node and the
  # configured node_ip would go stale.
  storageClassName: longhorn
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
