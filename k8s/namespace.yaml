apiVersion: v1
kind: Namespace
metadata:
  name: roost
  labels:
    # Pod Security Standards, enforced at admission time — every pod spec in
    # this namespace must meet the "restricted" profile (non-root, no added
    # capabilities, no privilege escalation, seccomp set, no hostPath/
    # hostNetwork/hostPID/hostIPC, etc.), matching the securityContext
    # already set on every Deployment under k8s/. `enforce` is what actually
    # blocks a non-compliant pod; `audit`/`warn` are redundant with it today
    # but cost nothing and keep surfacing violations in logs/kubectl output
    # if this ever gets loosened. See k8s/README.md's Hardening section.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# LiveKit lives here rather than in `roost` because its Tailscale sidecar
# needs NET_ADMIN to bring up a kernel-mode tailnet interface, which the
# "restricted" profile forbids. Isolating it keeps `roost` fully restricted
# instead of loosening the whole deployment for one pod's requirement.
# "baseline" still blocks the things that actually matter here — privileged
# containers, host namespaces, hostPath volumes, host ports — while allowing
# the one capability the sidecar genuinely needs. See k8s/README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: roost-media
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
