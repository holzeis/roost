# No Pod Security Standards labels here, deliberately.
#
# LiveKit's Tailscale sidecar needs NET_ADMIN to bring up a kernel-mode
# tailnet interface (see k8s/livekit/deployment.yaml for why that's the
# media path's only workable shape). Both the `restricted` and `baseline`
# profiles forbid it: restricted requires dropping ALL capabilities and
# permits adding only NET_BIND_SERVICE, and baseline permits only the
# default capability set, which doesn't include NET_ADMIN either. The only
# ways to keep admission enforcement would be a PSS exemption configured at
# the API-server level (AdmissionConfiguration, not expressible in a
# manifest and needing k3s server config changes) or splitting LiveKit into
# its own unlabelled namespace — neither worth the operational cost here.
#
# What still enforces the hardening: every pod's own securityContext
# (runAsNonRoot with explicit uid/gid, all capabilities dropped, no
# privilege escalation, RuntimeDefault seccomp, readOnlyRootFilesystem on
# chat-server). Those are the real controls; the PSS labels were only an
# admission-time backstop against a future manifest regressing them. See
# k8s/README.md's Hardening section.
apiVersion: v1
kind: Namespace
metadata:
  name: roost
