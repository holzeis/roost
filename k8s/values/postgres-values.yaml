# Values for the bitnami/postgresql chart (cluster-internal only — never
# exposed to the tailnet; only chat-server talks to it).
# helm install postgres bitnami/postgresql -n roost -f postgres-values.yaml

auth:
  username: roost
  database: roost
  existingSecret: chat-server-db-password # key: password

primary:
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Single-node home cluster: no read replicas.
architecture: standalone
