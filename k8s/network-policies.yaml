# Restricts which pods in the `roost` namespace can reach which — ingress
# only (egress is unrestricted for now; locking that down too needs allowing
# DNS, the k8s API for the Tailscale operator's own components, and outbound
# HTTPS for APNs/FCM/link-preview fetches, which is a bigger, riskier change
# than this pass). Kubernetes NetworkPolicies require a CNI that enforces
# them (Flannel, k3s's default, does NOT — see k8s/README.md).
#
# 1. Default-deny all ingress in the namespace.
# 2. Explicit allows carve back exactly what's needed:
#    - chat-server -> postgres:5432
#    - chat-server -> minio:9000
# chat-server itself gets no explicit allow-ingress rule: nothing in normal
# cluster networking needs to reach it (it has no Service — see
# k8s/chat-server/deployment.yaml — and is only reachable via its own
# embedded tsnet listener), so the default-deny below is exactly right for it.
#
# LiveKit isn't covered here at all: it now lives in the `roost-media`
# namespace as its own tailnet node (see k8s/livekit/deployment.yaml), and
# its traffic arrives over the WireGuard interface inside its pod rather
# than through cluster networking, so NetworkPolicy isn't the control point
# for it. Deliberately left without a policy of its own rather than adding a
# speculative one that might silently break the media path again.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: roost
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-chat-server
  namespace: roost
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: chat-server
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-allow-chat-server
  namespace: roost
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: chat-server
      ports:
        - port: 9000
