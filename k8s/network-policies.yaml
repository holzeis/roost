# Restricts which pods in the `roost` namespace can reach which — ingress
# only (egress is unrestricted for now; locking that down too needs allowing
# DNS, the k8s API for the Tailscale operator's own components, and outbound
# HTTPS for APNs/FCM/link-preview fetches, which is a bigger, riskier change
# than this pass). Kubernetes NetworkPolicies require a CNI that enforces
# them (Flannel, k3s's default, does NOT — see k8s/README.md).
#
# 1. Default-deny all ingress in the namespace.
# 2. Explicit allows carve back exactly what's needed:
#    - chat-server -> postgres:5432
#    - chat-server -> minio:9000
#    - the Tailscale operator's proxy pod (a different namespace,
#      `tailscale` by default) -> livekit's signaling/RTC ports, since
#      that's how tailnet clients actually reach it (see k8s/livekit's own
#      comments on why it's exposed via a LoadBalancer-class Service).
# chat-server itself gets no explicit allow-ingress rule: nothing in normal
# cluster networking needs to reach it (it has no Service — see
# k8s/chat-server/deployment.yaml — and is only reachable via its own
# embedded tsnet listener), so the default-deny below is exactly right for it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: roost
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-chat-server
  namespace: roost
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: chat-server
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-allow-chat-server
  namespace: roost
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: chat-server
      ports:
        - port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: livekit-allow-tailscale-operator
  namespace: roost
spec:
  podSelector:
    matchLabels:
      app: livekit
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # kubernetes.io/metadata.name is a built-in label every namespace
        # gets automatically (k8s 1.21+) — no manual labeling needed.
        # Adjust if your Tailscale operator install uses a different
        # namespace than the default.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - port: 7880
        - port: 7881
        - port: 50000
          protocol: UDP
        - port: 50001
          protocol: UDP
        - port: 50002
          protocol: UDP
        - port: 50003
          protocol: UDP
        - port: 50004
          protocol: UDP
        - port: 50005
          protocol: UDP
        - port: 50006
          protocol: UDP
        - port: 50007
          protocol: UDP
        - port: 50008
          protocol: UDP
        - port: 50009
          protocol: UDP
        - port: 50010
          protocol: UDP
        - port: 50011
          protocol: UDP
        - port: 50012
          protocol: UDP
        - port: 50013
          protocol: UDP
        - port: 50014
          protocol: UDP
        - port: 50015
          protocol: UDP
        - port: 50016
          protocol: UDP
        - port: 50017
          protocol: UDP
        - port: 50018
          protocol: UDP
        - port: 50019
          protocol: UDP
