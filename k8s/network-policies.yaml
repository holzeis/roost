# Restricts which pods in the `roost` namespace can reach which — ingress
# only (egress is unrestricted for now; locking that down too needs allowing
# DNS, the k8s API for the Tailscale operator's own components, and outbound
# HTTPS for APNs/FCM/link-preview fetches, which is a bigger, riskier change
# than this pass). Kubernetes NetworkPolicies require a CNI that enforces
# them (Flannel, k3s's default, does NOT — see k8s/README.md).
#
# 1. Default-deny all ingress in the namespace.
# 2. Explicit allows carve back exactly what's needed:
#    - chat-server -> postgres:5432
#    - chat-server -> minio:9000
# chat-server itself gets no explicit allow-ingress rule: nothing in normal
# cluster networking needs to reach it (it has no Service — see
# k8s/chat-server/deployment.yaml — and is only reachable via its own
# embedded tsnet listener), so the default-deny below is exactly right for it.
#
# LiveKit gets an explicit allow-all-ingress rule below rather than being
# left to the default-deny. Its client traffic arrives over the WireGuard
# interface inside its own pod (see k8s/livekit/deployment.yaml), which
# shouldn't traverse the CNI's policy hooks at all — but "shouldn't" varies
# by CNI, and a silently-dropped media path is exactly the bug that took
# this deployment a long time to diagnose once already. Access to it is
# gated by tailnet membership and a signed JWT regardless, so an open
# ingress rule here costs nothing real. Tighten it if you confirm your CNI
# leaves the tailscale interface alone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: roost
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-chat-server
  namespace: roost
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: chat-server
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-allow-chat-server
  namespace: roost
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: chat-server
      ports:
        - port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: livekit-allow-ingress
  namespace: roost
spec:
  podSelector:
    matchLabels:
      app: livekit
  policyTypes: ["Ingress"]
  ingress:
    - {} # allow from anywhere: see this file's header for why
