# Plain manifest (no Helm) for a single-replica MinIO instance — cluster-
# internal only; media uploads proxy through chat-server rather than
# exposing MinIO to the tailnet directly (see docs/architecture-overview.md's
# high-level architecture diagram). chat-server creates the `roost-media`
# bucket itself on startup if missing (server/internal/storage/storage.go),
# so no bucket-provisioning step is needed here.
#
# Credentials come from the single `roost-secrets` Secret shared by every
# service here (keys: minio-access-key, minio-secret-key) — the same two
# values chat-server reads for its own S3 client, stored once. See
# k8s/README.md for creating it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: roost
  labels:
    app: minio
spec:
  replicas: 1
  strategy:
    type: Recreate # avoids two pods briefly fighting over the same ReadWriteOnce PVC during a rollout
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      automountServiceAccountToken: false # this pod never talks to the k8s API
      enableServiceLinks: false # avoid Kubernetes' auto-injected <SVC>_PORT-style env vars; everything here uses explicit DNS names instead
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          # minio/minio on Docker Hub now requires authentication to pull;
          # quay.io is MinIO's recommended anonymous-pull mirror — matches
          # docker-compose.yml.
          image: quay.io/minio/minio:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            # An arbitrary non-root uid (1000) has no /etc/passwd entry, so
            # $HOME isn't set and would otherwise default to an unwritable
            # "/" — MinIO writes its own local config/state under $HOME, so
            # it needs pointing at somewhere writable (the emptyDir below).
            - name: HOME
              value: /home/minio-user
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: roost-secrets
                  key: minio-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: roost-secrets
                  key: minio-secret-key
          volumeMounts:
            - name: minio-data
              mountPath: /data
            - name: minio-home
              mountPath: /home/minio-user
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
        - name: minio-home
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: roost
spec:
  storageClassName: longhorn # so this volume can follow the pod across the cluster's nodes; see k8s/README.md
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # Images/video persist indefinitely (FR2.4); sized for family-scale,
      # grow as needed.
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: roost
spec:
  selector:
    app: minio
  ports:
    # Only the S3 API port is exposed — the admin console (9001) isn't
    # needed by chat-server; port-forward to it locally if you want to poke
    # around: kubectl port-forward -n roost svc/minio 9001:9001 and add
    # 9001 here temporarily, or add it permanently if you want console
    # access without port-forwarding.
    - name: api
      port: 9000
      targetPort: 9000
