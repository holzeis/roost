name: CI

# Build-and-test only. Kept separate from release.yml (app store shipping)
# per CLAUDE.md, so a release isn't blocked on this full matrix.
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: nothing here needs to write anything via
# GITHUB_TOKEN (the GHCR push below authenticates with a separate PAT, not
# this token) — every job only checks out the repo.
permissions:
  contents: read

jobs:
  server-test:
    name: server / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roost
          POSTGRES_PASSWORD: roost-ci-password
          POSTGRES_DB: roost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go test (unit)
        working-directory: server
        run: go test ./...
      - name: go test (integration)
        working-directory: server
        env:
          DATABASE_URL: postgres://roost:roost-ci-password@localhost:5432/roost?sslmode=disable
        run: go test -tags=integration ./...

  server-build-matrix:
    name: server / build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
      - name: Cross-compile
        working-directory: server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/server

  server-image:
    name: server / container image (amd64+arm64)
    runs-on: ubuntu-latest
    needs: [server-test, server-build-matrix]
    permissions:
      contents: read
      security-events: write # for the SARIF upload below, scoped to just this job
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Scan before push: a single-platform (amd64) build loaded into the
      # local docker daemon, separate from the real multi-arch build below
      # (a multi-platform buildx build can't be --load'ed locally at all).
      # Report-only for now (exit-code: '0') — it surfaces findings in the
      # repo's Security tab without blocking the pipeline; flip to '1' once
      # you've triaged the baseline and want new critical/high CVEs to
      # actually fail a build.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          load: true
          tags: roost-chat-server:scan
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: roost-chat-server:scan
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          severity: "CRITICAL,HIGH"
      - uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT  }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-chat-server:${{ github.sha }}

  app-test:
    name: app / analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test
