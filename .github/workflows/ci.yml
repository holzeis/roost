name: CI

# Build-and-test only. Kept separate from release.yml (app store shipping)
# per CLAUDE.md, so a release isn't blocked on this full matrix.
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default; jobs that need more (server-image, for the GHCR
# push) grant it explicitly in their own permissions block.
permissions:
  contents: read

jobs:
  # Detects which side(s) of the repo actually changed so the jobs below can
  # skip the half that didn't — a server-only change no longer waits on (or
  # burns minutes on) a Flutter build, and vice versa. Plain git diff rather
  # than a third-party path-filter action: one fewer dependency for what a
  # few lines of shell already do. A change to this workflow file itself
  # always runs everything, since that's exactly when it's least safe to
  # trust the skip logic.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Determine changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi

          if [ -z "$base" ]; then
            echo "No usable base commit (new branch/history) — running everything."
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "Changed files vs $base:"
          echo "$changed"

          server=false
          app=false
          if echo "$changed" | grep -qE '^(server/|\.github/workflows/ci\.yml)'; then
            server=true
          fi
          if echo "$changed" | grep -qE '^(app/|\.github/workflows/ci\.yml)'; then
            app=true
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  server-test:
    name: server / test
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roost
          POSTGRES_PASSWORD: roost-ci-password
          POSTGRES_DB: roost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go test (unit)
        working-directory: server
        run: go test ./...
      - name: go test (integration)
        working-directory: server
        env:
          DATABASE_URL: postgres://roost:roost-ci-password@localhost:5432/roost?sslmode=disable
        run: go test -tags=integration ./...

  server-build-matrix:
    name: server / build (${{ matrix.goarch }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
      - name: Cross-compile
        working-directory: server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/server

  server-image:
    name: server / container image (amd64+arm64)
    runs-on: ubuntu-latest
    needs: [changes, server-test, server-build-matrix]
    if: needs.changes.outputs.server == 'true'
    permissions:
      contents: read
      packages: write # so GITHUB_TOKEN itself can push to GHCR, instead of a separate long-lived PAT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Scan before push: a single-platform (amd64) build loaded into the
      # local docker daemon, separate from the real multi-arch build below
      # (a multi-platform buildx build can't be --load'ed locally at all).
      # Printed straight to the job log rather than uploaded as SARIF to the
      # repo's Security tab — that upload needs GitHub Advanced Security,
      # which isn't available on a private repo without a paid plan/GHAS
      # add-on (confirmed: it failed with "Code scanning is not enabled for
      # this repository", not a permissions issue — no permissions block
      # fixes that). Report-only for now (exit-code: '0'); flip to '1' once
      # you've triaged the baseline and want new critical/high CVEs to
      # actually fail a build.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          load: true
          tags: roost-chat-server:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: roost-chat-server:scan
          format: table
          exit-code: "0"
          severity: "CRITICAL,HIGH"
      # GITHUB_TOKEN previously hit "permission_denied: read_package" here:
      # the roost-chat-server package was originally created by a push
      # authenticated with a personal GHCR_PAT, not this repo's own
      # GITHUB_TOKEN, so it was never auto-linked to holzeis/roost's Actions
      # access. Fixed on GitHub's side (package Settings > Manage Actions
      # access > holzeis/roost, Write role) rather than by keeping a
      # standing PAT secret around.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}-chat-server:${{ github.sha }}
            ghcr.io/${{ github.repository }}-chat-server:latest
          # Same cache scope as the scan build above, so its amd64 layers
          # (module download, and any unchanged compiled output) are
          # already warm here rather than rebuilt a second time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  app-test:
    name: app / analyze + test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test
