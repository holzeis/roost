name: CI

# Build, test and ship. The app store release jobs (Android internal track,
# iOS TestFlight) run at the end, after the app's analyze + test job and
# nothing else: a release isn't held up by the server tests, the multi-arch
# images or the image scans, which run in parallel. They only run on pushes to
# main (and manual dispatches), never for pull requests.
#
# iOS/TestFlight is wired up — see docs/release-setup.md for the one-time
# Apple/App Store Connect setup and the repo secrets it needs — so it ships
# automatically whenever app/ changes land on main. Android still needs its
# own signing secrets (see that job's TODOs) before it can actually ship
# anything, so its job stays gated to workflow_dispatch only: an automatic run
# would either fail outright or silently build-and-not-upload on every app
# change, neither of which is better than just not running it yet. Un-gate it
# once ANDROID_KEYSTORE_BASE64/etc. and the Play Console upload step are in
# place.
on:
  push:
    branches: [main]
  pull_request:
  # Manual run: analyze + test the app, then build both release targets.
  workflow_dispatch:

# Least-privilege default; jobs that need more (server-image, for the GHCR
# push) grant it explicitly in their own permissions block.
permissions:
  contents: read

jobs:
  # Detects which side(s) of the repo actually changed so the jobs below can
  # skip the half that didn't — a server-only change no longer waits on (or
  # burns minutes on) a Flutter build, and vice versa. Plain git diff rather
  # than a third-party path-filter action: one fewer dependency for what a
  # few lines of shell already do. A change to this workflow file itself
  # always runs everything, since that's exactly when it's least safe to
  # trust the skip logic.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      app: ${{ steps.filter.outputs.app }}
      app_code: ${{ steps.filter.outputs.app_code }}
      image_watcher: ${{ steps.filter.outputs.image_watcher }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Determine changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A manual run is for releasing the app: test it, whatever changed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "server=false" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "app_code=true" >> "$GITHUB_OUTPUT"
            echo "image_watcher=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi

          if [ -z "$base" ]; then
            echo "No usable base commit (new branch/history) — running everything."
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "app_code=true" >> "$GITHUB_OUTPUT"
            echo "image_watcher=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "Changed files vs $base:"
          echo "$changed"

          server=false
          app=false
          app_code=false
          image_watcher=false
          if echo "$changed" | grep -qE '^(server/|\.github/workflows/ci\.yml)'; then
            server=true
          fi
          if echo "$changed" | grep -qE '^(app/|\.github/workflows/ci\.yml)'; then
            app=true
          fi
          # What a release ships: the app itself, not a change to this workflow.
          if echo "$changed" | grep -qE '^app/'; then
            app_code=true
          fi
          if echo "$changed" | grep -qE '^(image-watcher/|\.github/workflows/ci\.yml)'; then
            image_watcher=true
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "app_code=$app_code" >> "$GITHUB_OUTPUT"
          echo "image_watcher=$image_watcher" >> "$GITHUB_OUTPUT"

  server-test:
    name: server / test
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roost
          POSTGRES_PASSWORD: roost-ci-password
          POSTGRES_DB: roost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go test (unit)
        working-directory: server
        run: go test ./...
      - name: go test (integration)
        working-directory: server
        env:
          DATABASE_URL: postgres://roost:roost-ci-password@localhost:5432/roost?sslmode=disable
        run: go test -tags=integration ./...

  server-build-matrix:
    name: server / build (${{ matrix.goarch }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
      - name: Cross-compile
        working-directory: server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -o /dev/null ./cmd/server
          go build -o /dev/null ./cmd/alert-bridge

  server-image:
    name: server / container image (amd64+arm64)
    runs-on: ubuntu-latest
    needs: [changes, server-test, server-build-matrix]
    if: needs.changes.outputs.server == 'true'
    permissions:
      contents: read
      packages: write # so GITHUB_TOKEN itself can push to GHCR, instead of a separate long-lived PAT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Scan before push: a single-platform (amd64) build loaded into the
      # local docker daemon, separate from the real multi-arch build below
      # (a multi-platform buildx build can't be --load'ed locally at all).
      # Printed straight to the job log rather than uploaded as SARIF to the
      # repo's Security tab — that upload needs GitHub Advanced Security,
      # which isn't available on a private repo without a paid plan/GHAS
      # add-on (confirmed: it failed with "Code scanning is not enabled for
      # this repository", not a permissions issue — no permissions block
      # fixes that). Report-only for now (exit-code: '0'); flip to '1' once
      # you've triaged the baseline and want new critical/high CVEs to
      # actually fail a build.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          load: true
          tags: roost-chat-server:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: roost-chat-server:scan
          format: table
          exit-code: "0"
          severity: "CRITICAL,HIGH"
      # GITHUB_TOKEN previously hit "permission_denied: read_package" here:
      # the roost-chat-server package was originally created by a push
      # authenticated with a personal GHCR_PAT, not this repo's own
      # GITHUB_TOKEN, so it was never auto-linked to holzeis/roost's Actions
      # access. Fixed on GitHub's side (package Settings > Manage Actions
      # access > holzeis/roost, Write role) rather than by keeping a
      # standing PAT secret around.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}-chat-server:${{ github.sha }}
            ghcr.io/${{ github.repository }}-chat-server:latest
          # Same cache scope as the scan build above, so its amd64 layers
          # (module download, and any unchanged compiled output) are
          # already warm here rather than rebuilt a second time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  alert-bridge-image:
    name: alert-bridge / container image (amd64+arm64)
    runs-on: ubuntu-latest
    needs: [changes, server-test, server-build-matrix]
    if: needs.changes.outputs.server == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Same scan-before-push shape as server-image (report-only for now).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          file: server/Dockerfile.alert-bridge
          load: true
          tags: roost-alert-bridge:scan
          cache-from: type=gha,scope=alert-bridge
          cache-to: type=gha,mode=max,scope=alert-bridge
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: roost-alert-bridge:scan
          format: table
          exit-code: "0"
          severity: "CRITICAL,HIGH"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          file: server/Dockerfile.alert-bridge
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}-alert-bridge:${{ github.sha }}
            ghcr.io/${{ github.repository }}-alert-bridge:latest
          cache-from: type=gha,scope=alert-bridge
          cache-to: type=gha,mode=max,scope=alert-bridge

  image-watcher-image:
    name: image-watcher / container image (amd64+arm64)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.image_watcher == 'true'
    permissions:
      contents: read
      packages: write # so GITHUB_TOKEN itself can push to GHCR, instead of a separate long-lived PAT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Same scan-before-push shape as server-image's own job — see its
      # comments for why this is report-only (exit-code: '0') for now and
      # printed to the job log rather than uploaded as SARIF.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: image-watcher
          load: true
          tags: roost-image-watcher:scan
          cache-from: type=gha,scope=image-watcher
          cache-to: type=gha,mode=max,scope=image-watcher
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: roost-image-watcher:scan
          format: table
          exit-code: "0"
          severity: "CRITICAL,HIGH"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: image-watcher
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}-image-watcher:${{ github.sha }}
            ghcr.io/${{ github.repository }}-image-watcher:latest
          cache-from: type=gha,scope=image-watcher
          cache-to: type=gha,mode=max,scope=image-watcher

  app-test:
    name: app / analyze + test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test

  release-android:
    name: release / android internal track
    needs: [changes, app-test]
    runs-on: ubuntu-latest
    # Not wired up yet (see the TODOs below and docs/release-setup.md) — only
    # runs when someone deliberately dispatches it, never on a push, so an
    # ordinary app change doesn't burn a runner on a build with no signing
    # that has nowhere to go anyway.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - working-directory: app
        run: flutter pub get

      # build.gradle reads MAPS_API_KEY from local.properties (gitignored,
      # per-developer locally — see README's "Google Maps API keys"), which
      # doesn't exist on this runner at all. Without it, google_maps_flutter
      # silently gets an empty key and crashes natively the first time a
      # location-share message renders a map (see the release-ios job's matching
      # Config.xcconfig step below).
      - name: Configure Google Maps API key
        working-directory: app/android
        run: echo "MAPS_API_KEY=${{ secrets.ANDROID_GOOGLE_MAPS_API_KEY }}" >> local.properties

      # TODO: decode signing key + key.properties from secrets before this
      # step (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) once release signing is set
      # up — see https://docs.flutter.dev/deployment/android#signing-the-app
      # API_BASE_URL/LIVEKIT_URL default to localhost (see api_config.dart),
      # which is only right for a local simulator/emulator sharing the dev
      # machine's network — a real device needs the deployed tailnet
      # hostnames instead (see k8s/chat-server and k8s/livekit's
      # TSNET_HOSTNAME/TS_HOSTNAME). Both listen unencrypted (plain
      # http/ws) since the tailnet's own WireGuard layer already encrypts
      # this traffic.
      # DEMO_AVAILABLE offers the in-app demo (app/lib/demo/) on the "can't
      # reach the server" screen, for App Store review — on only while the
      # repository variable DEMO_AVAILABLE is "true"; unset or anything else
      # builds without it. See docs/ios-dev-setup.md's "App Store review".
      # --build-number overrides pubspec.yaml's static "+1" — App Store
      # Connect/Play Console both reject a re-upload whose build number
      # isn't strictly higher than one they've already seen, so pubspec's
      # own value would only ever work for a single release. github.run_number
      # increments on every workflow run, so each dispatch gets a fresh one
      # for free.
      - name: Build release app bundle
        working-directory: app
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=http://roost-chat \
            --dart-define=LIVEKIT_URL=ws://roost-livekit:7880 \
            --dart-define=DEMO_AVAILABLE=${{ vars.DEMO_AVAILABLE == 'true' }}

      # TODO: upload app/build/app/outputs/bundle/release/app-release.aab to
      # the Play Console internal testing track, e.g. via
      # r0adkll/upload-google-play with a GOOGLE_PLAY_SERVICE_ACCOUNT secret.

  release-ios:
    name: release / TestFlight
    needs: [changes, app-test]
    runs-on: macos-latest
    # After app / analyze + test passed (a skipped or failed test job skips
    # this one). On a push only when app/ itself changed; a manual dispatch
    # always releases.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.app_code == 'true')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - working-directory: app
        run: flutter pub get

      # Imports the Apple Distribution certificate into a throwaway keychain
      # scoped to this job — see docs/release-setup.md for how to export the
      # .p12 and base64-encode it into IOS_DIST_CERTIFICATE_BASE64.
      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}

      # xcodebuild finds provisioning profiles here by convention — this
      # just decodes the secret into place, no action needed. The profile's
      # own Name must match ios/ExportOptions.plist's provisioningProfiles
      # entry ("Roost App Store"), not this filename.
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/roost.mobileprovision

      # The share extension (ios/ShareExtension/, "share into Roost") is its
      # own App ID with its own profile, named "Roost Share Extension App
      # Store" to match ExportOptions.plist — see docs/ios-dev-setup.md.
      - name: Install share extension provisioning profile
        env:
          IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/roost-share-extension.mobileprovision

      # The notification service extension (ios/NotificationServiceExtension/,
      # decrypts message previews — FR5.2) is its own App ID with its own
      # profile, "Roost Notification Service App Store" to match
      # ExportOptions.plist — see docs/ios-dev-setup.md.
      - name: Install notification service extension provisioning profile
        env:
          IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/roost-notification-service.mobileprovision

      # AppDelegate.swift reads GMSApiKey from Info.plist, substituted at
      # build time from Config.xcconfig (gitignored, per-developer — see
      # README's "Google Maps API keys"), which doesn't exist on this
      # runner. Without it the key ends up empty, AppDelegate's own
      # empty-check skips calling GMSServices.provideAPIKey, and Maps SDK
      # then crashes natively (an uncaught NSException, not something Dart
      # try/catch can reach) the first time a location-share message tries
      # to render a map.
      - name: Configure Google Maps API key
        working-directory: app/ios/Runner
        run: echo "GOOGLE_MAPS_API_KEY = ${{ secrets.IOS_GOOGLE_MAPS_API_KEY }}" > Config.xcconfig

      # See the release-android job's identical comments above — same reasoning for
      # both --build-number (App Store Connect rejects a re-upload whose
      # CFBundleVersion isn't strictly higher than one it's already seen)
      # and the API_BASE_URL/LIVEKIT_URL defines (reach the real deployed
      # server, not localhost).
      - name: Build release IPA
        working-directory: app
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=http://roost-chat \
            --dart-define=LIVEKIT_URL=ws://roost-livekit:7880 \
            --dart-define=DEMO_AVAILABLE=${{ vars.DEMO_AVAILABLE == 'true' }}

      # upload-testflight-build's appstore-api backend takes app-path as a
      # literal resolved file path, not a glob — handing it the "*.ipa"
      # pattern directly fails with "ADM-ZIP: Invalid filename" trying to
      # read a file literally named that. Resolve it to the one real file
      # first (flutter build ipa always produces exactly one).
      - name: Locate built IPA
        id: ipa
        run: echo "path=$(ls app/build/ios/ipa/*.ipa)" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@1fc69ca369a60b813eaaa2d936eda22794b52e17 # v5.4.0
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_KEY }}
