name: Release

# Ships app builds to the Android internal testing track and iOS TestFlight.
# Deliberately separate from ci.yml so a release isn't gated on the full
# build-and-test matrix — this still builds and code-signs the app itself,
# just without re-running unrelated CI jobs (server tests, multi-arch server
# image, etc).
#
# iOS/TestFlight is wired up — see docs/release-setup.md for the one-time
# Apple/App Store Connect setup and the repo secrets it needs. Android still
# needs its own signing secrets (see that job's TODOs) before it can run.
# The trigger stays manual-only until both sides are confirmed working end
# to end, so it can't fire and fail unexpectedly on a push.
on:
  workflow_dispatch:
  # push:
  #   tags: ["v*"]

# Least-privilege default — revisit once the upload steps below are wired
# to real credentials/actions; some may need their own scoped permissions
# (e.g. id-token: write if an upload action uses OIDC instead of a secret).
permissions:
  contents: read

jobs:
  android:
    name: release / android internal track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - working-directory: app
        run: flutter pub get

      # TODO: decode signing key + key.properties from secrets before this
      # step (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) once release signing is set
      # up — see https://docs.flutter.dev/deployment/android#signing-the-app
      - name: Build release app bundle
        working-directory: app
        run: flutter build appbundle --release

      # TODO: upload app/build/app/outputs/bundle/release/app-release.aab to
      # the Play Console internal testing track, e.g. via
      # r0adkll/upload-google-play with a GOOGLE_PLAY_SERVICE_ACCOUNT secret.

  ios:
    name: release / TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - working-directory: app
        run: flutter pub get

      # Imports the Apple Distribution certificate into a throwaway keychain
      # scoped to this job — see docs/release-setup.md for how to export the
      # .p12 and base64-encode it into IOS_DIST_CERTIFICATE_BASE64.
      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}

      # xcodebuild finds provisioning profiles here by convention — this
      # just decodes the secret into place, no action needed. The profile's
      # own Name must match ios/ExportOptions.plist's provisioningProfiles
      # entry ("Roost App Store"), not this filename.
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/roost.mobileprovision

      - name: Build release IPA
        working-directory: app
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # upload-testflight-build's appstore-api backend takes app-path as a
      # literal resolved file path, not a glob — handing it the "*.ipa"
      # pattern directly fails with "ADM-ZIP: Invalid filename" trying to
      # read a file literally named that. Resolve it to the one real file
      # first (flutter build ipa always produces exactly one).
      - name: Locate built IPA
        id: ipa
        run: echo "path=$(ls app/build/ios/ipa/*.ipa)" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@1fc69ca369a60b813eaaa2d936eda22794b52e17 # v5.4.0
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_KEY }}
